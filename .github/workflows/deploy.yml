name: Deploy Backend to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/TCP_Main_Server
            
            # 1. Pull the latest code (this ignores the sqlite DB and media files, keeping them safe)
            git pull origin main
            
            # 2. Activate python environment
            source venv/bin/activate
            
            # 3. Install new dependencies if any
            pip install -r requirements.txt
            
            # 4. Safely update database schema
            python manage.py migrate
            
            # 5. Prepare static files for Nginx
            python manage.py collectstatic --noinput
            
            # 6. Restart the backend
            sudo systemctl restart tcp_backend.service
